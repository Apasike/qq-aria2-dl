services:
  aria2:
    image: p3terx/aria2-pro:latest
    container_name: aria2
    restart: unless-stopped
    environment:
      - RPC_SECRET=${ARIA2_SECRET:-please-change-me}
      - RPC_LISTEN_PORT=6800
    volumes:
      - ./data/downloads:/downloads
      - ./data/aria2:/config

  bot:
    build: .
    container_name: qq-aria2-dl
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_HOST: 0.0.0.0
      ARIA2_RPC_URL: http://aria2:6800/jsonrpc
      ARIA2_DOWNLOAD_DIR: /data/downloads
      STORAGE_DB_PATH: /data/bot/bot.db
    volumes:
      - ./data/downloads:/data/downloads
      - ./data/bot:/data/bot
    ports:
      - "8080:8080"
    depends_on:
      - aria2